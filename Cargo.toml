[package]
name = "boat-sdk"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
description = "Rust SDK for the Boat VM API"
license = "MIT"
repository = "https://github.com/caelurium/boat-sdk-rs"
readme = "README.md"

[dependencies]
base64 = "0.22"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
