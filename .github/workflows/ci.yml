name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-structure:
    name: rust-structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: caelurium/rust-structure@v1
        with:
          base-ref: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
          config: .github/rust-structure.json

  rust-format:
    name: rust-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-lint:
    name: rust-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rust-tests:
    name: rust-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  rust-docs:
    name: rust-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps

  release:
    name: Publish version bump
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-structure, rust-format, rust-lint, rust-tests, rust-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag and publish the tested commit
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version() { python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["package"]["version"])'; }
          previous=$(git show "${BEFORE}:Cargo.toml" | version)
          current=$(version < Cargo.toml)
          if [[ "$current" == "$previous" ]]; then
            echo "Version unchanged ($current); skipping release."
            exit 0
          fi

          tag="v$current"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git rev-list -n 1 "refs/tags/$tag")" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already points to another commit."
              exit 1
            fi
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                tag -a "$tag" "$GITHUB_SHA" -m "Boat Rust SDK $tag"
            git push origin "refs/tags/$tag"
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            flags=()
            if [[ "${current%%+*}" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$tag" --verify-tag --title "Boat Rust SDK $tag" --generate-notes "${flags[@]}"
          fi
