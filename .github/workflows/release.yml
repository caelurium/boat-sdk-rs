name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Prepare or publish release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Annotate the tested version bump
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version() { python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["package"]["version"])'; }
          previous=$(git show "${BEFORE}:Cargo.toml" | version)
          current=$(version < Cargo.toml)
          if [[ "$current" == "$previous" ]]; then
            echo "Version unchanged ($current); skipping release."
            exit 0
          fi

          tag="v$current"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git rev-list -n 1 "refs/tags/$tag")" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already points to another commit."
              exit 1
            fi
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                tag -a "$tag" "$GITHUB_SHA" -m "Boat Rust SDK $tag"
            git push origin "refs/tags/$tag"
          fi

      - name: Update release PR or publish a merged release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
