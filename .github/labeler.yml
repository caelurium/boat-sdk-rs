sdk:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "tests/**"

build:
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.toml"
          - "Cargo.lock"
          - "rust-toolchain.toml"
          - "flake.nix"
          - "Makefile"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/labeler.yml"
          - ".github/dependabot.yml"
          - ".github/PULL_REQUEST_TEMPLATE.md"
          - ".github/rust-structure.json"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "AGENTS.md"
          - "docs/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.toml"
          - "Cargo.lock"

bug:
  - head-branch: ["^fix/", "^bugfix/"]

enhancement:
  - head-branch: ["^feat/", "^feature/"]

maintenance:
  - head-branch: ["^chore/", "^ci/", "^refactor/"]
